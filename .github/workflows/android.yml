name: Build trainer APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'music/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk/platforms/android-35" || ! -d "$sdk/build-tools/34.0.0" ]]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$manager" ]]; then
              manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            fi
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;34.0.0'
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: bash prepare-assets.sh
      - name: Render original menu soundtrack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy libfluidsynth3 timgm6mb-soundfont ffmpeg
          /usr/bin/python3 music/opening.py
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Stockfish-Trainer-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish verified APK on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F "'" '/versionName/{print $2}' app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version already published; not overwriting existing release."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Stockfish-Trainer.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging Stockfish-Trainer.apk > package.txt
          grep -F "versionName='$version'" package.txt
          grep -F "name='uk.trainer.chess'" package.txt
          gh release create "v$version" Stockfish-Trainer.apk --target "$GITHUB_SHA" --title "Stockfish Trainer $version" --notes "Exact original v1.1.6 chess piece artwork and styling restored. The v1.1.8 sage and emerald board colours and larger landscape layout are retained. Game rules, coaching and music unchanged. Debug-signed APK."
