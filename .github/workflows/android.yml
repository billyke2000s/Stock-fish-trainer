name: Build trainer APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'music/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash prepare-assets.sh
      - name: Render original menu soundtrack
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy libfluidsynth3 timgm6mb-soundfont ffmpeg
          /usr/bin/python3 music/opening.py
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Stockfish-Trainer-APK
          path: app/build/outputs/apk/debug/*.apk
