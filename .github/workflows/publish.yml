name: Publish packaged APK
on:
  push:
    branches: [main]
    paths: ['downloads/Stockfish-Trainer.apk']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish layout fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.4 downloads/Stockfish-Trainer.apk --target "$GITHUB_SHA" --title 'Stockfish Trainer 1.0.4' --notes 'Adds Between Moves, an original offline jazz loop. Tap Music to listen. Installs over v1.0.3.'
