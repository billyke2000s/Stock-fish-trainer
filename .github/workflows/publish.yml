name: Publish packaged APK
on:
  push:
    branches: [main]
    paths: ['downloads/Stockfish-Trainer.apk']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish first device-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 downloads/Stockfish-Trainer.apk --target "$GITHUB_SHA" --title 'Stockfish Trainer 1.0.0' --notes 'First Android device-test build. Download Stockfish-Trainer.apk to play generated games offline, get hints, and retry mistakes against Stockfish.'
