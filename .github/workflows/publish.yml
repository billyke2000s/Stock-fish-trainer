name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android build run ID
        required: true
        default: '45563936690'
      version:
        description: Release version without v prefix
        required: true
        default: '1.1.1'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-trainer-apk
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id || '45563936690' }}
      VERSION: ${{ inputs.version || '1.1.1' }}
    steps:
      - name: Download verified successful build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh run view "$RUN_ID" --json conclusion,headBranch,headSha,workflowName)
          jq -e '.conclusion == "success" and .headBranch == "main" and .workflowName == "Build trainer APK"' <<< "$run"
          echo "BUILD_SHA=$(jq -r .headSha <<< "$run")" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --name Stockfish-Trainer-APK --dir packaged
          mapfile -t apks < <(find packaged -type f -name '*.apk')
          [[ ${#apks[@]} == 1 ]]
          cp "${apks[0]}" Stockfish-Trainer.apk
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt=$(find "$sdk/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging Stockfish-Trainer.apk > package.txt
          grep -F "versionName='$VERSION'" package.txt
          grep -F "name='uk.trainer.chess'" package.txt
          sha256sum Stockfish-Trainer.apk
      - name: Publish APK release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "v$VERSION" Stockfish-Trainer.apk --target "$BUILD_SHA" --title "Stockfish Trainer $VERSION" --notes "Redesigned dark green and gold main menu, original Quiet Opening piano-led soundtrack, and repaired Android CI. Debug-signed test APK; an existing installation signed with a different key may require uninstalling before installing this version."
