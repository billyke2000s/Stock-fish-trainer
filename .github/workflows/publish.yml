name: Publish packaged APK
on:
  push:
    branches: [main]
    paths: ['downloads/Stockfish-Trainer.apk']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish layout fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 downloads/Stockfish-Trainer.apk --target "$GITHUB_SHA" --title 'Stockfish Trainer 1.0.2' --notes 'Adds file letters below the board and rank numbers on the left. Coordinates follow the player’s orientation. Installs over v1.0.1.'
