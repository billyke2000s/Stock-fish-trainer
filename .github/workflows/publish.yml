name: Publish packaged APK
on:
  push:
    branches: [main]
    paths: ['downloads/Stockfish-Trainer.apk']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish layout fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 downloads/Stockfish-Trainer.apk --target "$GITHUB_SHA" --title 'Stockfish Trainer 1.1.0' --notes 'Main menu with Velvet Gambit, an original jazz-funk theme. Choose Train, Player vs CPU or local pass-and-play. Installs over v1.0.6.'
