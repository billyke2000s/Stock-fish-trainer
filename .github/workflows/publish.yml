name: Publish packaged APK
on:
  push:
    branches: [main]
    paths: ['downloads/Stockfish-Trainer.apk']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish layout fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.3 downloads/Stockfish-Trainer.apk --target "$GITHUB_SHA" --title 'Stockfish Trainer 1.0.3' --notes 'Stockfish now sends coaching tips in a chat bubble with a fish avatar. The board stays in place when messages change. Installs over v1.0.2.'
