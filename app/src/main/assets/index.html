<section id="lobby" aria-label="Main menu">
<div class="lobby-top"><div class="wordmark"><span class="brand-mark" aria-hidden="true">♞</span><div><span class="brand-title">Chess Studio</span><span class="brand-subtitle">Your offline chess club</span></div></div><button id="theme" aria-pressed="false" aria-label="Play menu music">♪</button></div>
<div class="lobby-hero">
<div class="hero-art" aria-hidden="true"><div class="hero-board"></div><span class="hero-piece">♞</span><span class="hero-pawn">♟</span></div>

</div>
<nav aria-label="Game modes">
<button id="resume" hidden><span class="mode-icon" aria-hidden="true">▶</span><span class="mode-copy"><b>Resume game</b><span>Return to your board</span></span><span class="mode-arrow" aria-hidden="true">›</span></button>
<button class="training-tile" data-mode="train"><span class="mode-icon" aria-hidden="true">♘</span><span class="mode-copy"><b>Train</b><span>Improve with your Stockfish coach</span></span><span class="mode-arrow" aria-hidden="true">→</span></button>
<div class="mode-heading"><span>PLAY A MATCH</span><span>02 MODES</span></div>
<button class="play-tile cpu-tile" data-mode="cpu">

  <span class="tile-illustration" aria-hidden="true"><span class="mini-board"></span><span class="tile-piece rook">♜</span><span class="secondary-piece">♟</span></span>
  <span class="mode-copy"><b>Player vs CPU</b><span>Challenge Stockfish</span></span>
</button>

  <span class="tile-illustration" aria-hidden="true"><span class="mini-board"></span><span class="tile-piece kings">♚</span><span class="secondary-piece other-king">♚</span></span>

<footer class="lobby-footer"><span><i></i> OFFLINE PLAY</span><span>STOCKFISH ENGINE</span></footer>

<section id="match" hidden>

<div class="match-top"><header class="match-header"><button id="menu"><span aria-hidden="true">☰</span> Menu</button><div class="match-brand"><span aria-hidden="true">♞</span><span>CHESS STUDIO</span></div><button id="fresh"><span aria-hidden="true">＋</span> New game</button></header>
<div class="match-title"><span class="title-flourish" aria-hidden="true">❧</span><h1 id="mode-title">Train</h1><span class="title-flourish mirror" aria-hidden="true">❧</span></div>

  </div>
</section>
